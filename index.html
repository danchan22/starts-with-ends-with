<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starts With / Ends With</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }

        h1 { margin-top: 0; color: var(--primary); }
        
        .hidden { display: none !important; }

        /* Setup Screen */
        .setup-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #357abd; }
        
        .player-list {
            text-align: left;
            margin: 20px 0;
            padding-left: 20px;
        }

        /* Game Screen */
        .letter-display {
            display: flex;
            justify-content: space-around;
            margin: 40px 0;
        }
        .letter-box {
            background: var(--dark);
            color: white;
            padding: 20px;
            border-radius: 12px;
            width: 40%;
        }
        .letter-box h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .letter { font-size: 64px; font-weight: bold; margin-top: 10px; }

        /* Scoreboard */
        .scoreboard {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .score-name { font-weight: bold; font-size: 18px; text-align: left; flex: 1; }
        .score-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-controls button {
            padding: 6px 12px;
            font-size: 14px;
        }
        .btn-plus { background-color: var(--success); }
        .btn-plus:hover { background-color: #27ae60; }
        .btn-minus { background-color: var(--danger); }
        .btn-minus:hover { background-color: #c0392b; }
        
        .points { font-size: 18px; font-weight: bold; min-width: 60px; text-align: right; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Starts With / Ends With</h1>

    <div id="setup-screen">
        <h3>Enter Player Names</h3>
        <div class="setup-group">
            <input type="text" id="player-input" placeholder="Player Name...">
            <button onclick="addPlayer()">Add</button>
        </div>
        <ul id="player-list" class="player-list"></ul>
        <button id="start-btn" style="width: 100%; margin-top: 20px;" onclick="startGame()" disabled>Start Game</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="letter-display">
            <div class="letter-box">
                <h2>Starts With</h2>
                <div class="letter" id="start-letter">-</div>
            </div>
            <div class="letter-box">
                <h2>Ends With</h2>
                <div class="letter" id="end-letter">-</div>
            </div>
        </div>

        <button onclick="nextRound()" style="font-size: 20px; padding: 15px 40px;">Next Round 🎲</button>

        <div class="scoreboard">
            <h3>Scoreboard</h3>
            <div id="scores-container"></div>
        </div>
    </div>
</div>

<script>
    // Game Configuration Letters - Option 2: Balanced Mix
    const startsWithLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T', 'V', 'W', 'Y'];
    const endsWithLetters = ['A', 'D', 'E', 'G', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T', 'Y'];

    let players = [];

    // Add player to the setup list
    function addPlayer() {
        const input = document.getElementById('player-input');
        const name = input.value.trim();
        
        if (name && !players.some(p => p.name === name)) {
            players.push({ name: name, score: 0 });
            input.value = '';
            updatePlayerList();
            document.getElementById('start-btn').disabled = false;
        }
        input.focus();
    }

    // Allow pressing "Enter" key to add player
    document.getElementById('player-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addPlayer();
    });

    function updatePlayerList() {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p => `<li>${p.name}</li>`).join('');
    }

    // Transition to game screen
    function startGame() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        renderScoreboard();
        nextRound();
    }

    // Generate random letters
    function nextRound() {
        const randomStart = startsWithLetters[Math.floor(Math.random() * startsWithLetters.length)];
        const randomEnd = endsWithLetters[Math.floor(Math.random() * endsWithLetters.length)];
        
        document.getElementById('start-letter').innerText = randomStart;
        document.getElementById('end-letter').innerText = randomEnd;
    }

    // Adjust score (+1 or -1)
    function adjustScore(index, amount) {
        players[index].score += amount;
        renderScoreboard();
    }

    // Build the scoreboard UI
    function renderScoreboard() {
        const container = document.getElementById('scores-container');
        container.innerHTML = players.map((player, index) => `
            <div class="score-row">
                <span class="score-name">${player.name}</span>
                <div class="score-controls">
                    <span class="points">${player.score} pts</span>
                    <button class="btn-minus" onclick="adjustScore(${index}, -1)">-1</button>
                    <button class="btn-plus" onclick="adjustScore(${index}, 1)">+1</button>
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
