<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starts With / Ends With</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --success: #2ecc71;
            --success-dark: #27ae60;
            --danger: #e74c3c;
            --danger-dark: #c0392b;
            --dark: #1a252f;
            --light-bg: #f0f4f8;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--dark);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .hidden { display: none !important; }

        /* --- SETUP SCREEN --- */
        .setup-card {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 20px 15px;
            margin-bottom: 20px;
        }

        .setup-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .player-list {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            text-align: left;
        }

        .player-list li {
            background: white;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- BUTTONS --- */
        .btn {
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
        }

        .btn-primary {
            background-color: var(--primary);
            box-shadow: 0 5px 0 var(--primary-dark);
        }

        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .btn-main {
            width: 100%;
            font-size: 18px;
            padding: 16px;
            margin-top: 10px;
        }

        .btn-main:disabled {
            background-color: #cbd5e1;
            box-shadow: 0 5px 0 #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* --- GAMEPLAY SCREEN --- */
        .letter-display {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 25px 0;
        }

        .letter-box {
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            color: #ffffff;
            padding: 20px 10px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.2);
            flex: 1;
        }

        .letter-box h2 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
        }

        .letter {
            font-size: 68px;
            font-weight: 900;
            margin-top: 5px;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Pop Animation */
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-next {
            font-size: 20px;
            padding: 16px 40px;
            background-color: var(--primary);
            box-shadow: 0 6px 0 var(--primary-dark), 0 10px 15px rgba(74, 144, 226, 0.3);
        }

        .btn-next:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark), 0 5px 10px rgba(74, 144, 226, 0.2);
        }

        /* --- SCOREBOARD --- */
        .scoreboard {
            margin-top: 35px;
            border-top: 2px solid #f1f5f9;
            padding-top: 20px;
        }

        .scoreboard h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-name {
            font-weight: 700;
            font-size: 17px;
            text-align: left;
            flex: 1;
            color: #334155;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .points-badge {
            background: #e2e8f0;
            color: #1e293b;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            min-width: 55px;
            text-align: center;
        }

        .btn-score {
            width: 38px;
            height: 38px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 0;
        }

        .btn-plus {
            background-color: var(--success);
            box-shadow: 0 4px 0 var(--success-dark);
        }
        .btn-plus:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--success-dark);
        }

        .btn-minus {
            background-color: var(--danger);
            box-shadow: 0 4px 0 var(--danger-dark);
        }
        .btn-minus:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--danger-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Starts With / Ends With</h1>

    <!-- SCREEN 1: START/SETUP -->
    <div id="setup-screen">
        <div class="setup-card">
            <h3 style="margin:0 0 10px 0; color:#475569;">Add Players</h3>
            <div class="setup-group">
                <input type="text" id="player-input" placeholder="Player name...">
                <button class="btn btn-primary" onclick="addPlayer()" style="padding: 0 20px;">Add</button>
            </div>
            <ul id="player-list" class="player-list"></ul>
        </div>
        <button id="start-btn" class="btn btn-primary btn-main" onclick="startGame()" disabled>Start Game</button>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="game-screen" class="hidden">
        <div class="letter-display">
            <div class="letter-box">
                <h2>Starts With</h2>
                <div class="letter" id="start-letter">-</div>
            </div>
            <div class="letter-box">
                <h2>Ends With</h2>
                <div class="letter" id="end-letter">-</div>
            </div>
        </div>

        <button class="btn btn-next" onclick="nextRound()">Next Round 🎲</button>

        <div class="scoreboard">
            <h3>Scoreboard</h3>
            <div id="scores-container"></div>
        </div>
    </div>
</div>

<script>
    // Game Configuration - Option 2: Balanced Mix Pool
    const startsWithLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T', 'V', 'W', 'Y'];
    const endsWithLetters = ['A', 'D', 'E', 'G', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T', 'Y'];

    let players = [];
    let audioCtx = null;

    // Web Audio Synthesizer (Instant native sound effects)
    function playAudio(type) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'next') {
            // Pop sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'point') {
            // High chime sound
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    // Add player to the setup list
    function addPlayer() {
        const input = document.getElementById('player-input');
        const name = input.value.trim();
        
        if (name && !players.some(p => p.name === name)) {
            players.push({ name: name, score: 0 });
            input.value = '';
            updatePlayerList();
            document.getElementById('start-btn').disabled = false;
        }
        input.focus();
    }

    document.getElementById('player-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addPlayer();
    });

    function updatePlayerList() {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p => `<li>${p.name}</li>`).join('');
    }

    function startGame() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        renderScoreboard();
        nextRound();
    }

    function nextRound() {
        playAudio('next');

        const randomStart = startsWithLetters[Math.floor(Math.random() * startsWithLetters.length)];
        const randomEnd = endsWithLetters[Math.floor(Math.random() * endsWithLetters.length)];
        
        const startEl = document.getElementById('start-letter');
        const endEl = document.getElementById('end-letter');

        startEl.innerText = randomStart;
        endEl.innerText = randomEnd;

        // Trigger popping animation
        startEl.classList.remove('pop');
        endEl.classList.remove('pop');
        void startEl.offsetWidth; // Force CSS reflow
        startEl.classList.add('pop');
        endEl.classList.add('pop');
    }

    function adjustScore(index, amount) {
        if (amount > 0) playAudio('point');
        players[index].score += amount;
        renderScoreboard();
    }

    function renderScoreboard() {
        const container = document.getElementById('scores-container');
        container.innerHTML = players.map((player, index) => `
            <div class="score-row">
                <span class="score-name">${player.name}</span>
                <div class="score-controls">
                    <span class="points-badge">${player.score} pts</span>
                    <button class="btn btn-minus btn-score" onclick="adjustScore(${index}, -1)">-</button>
                    <button class="btn btn-plus btn-score" onclick="adjustScore(${index}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
