<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starts With / Ends With</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --success: #2ecc71;
            --success-dark: #27ae60;
            --danger: #e74c3c;
            --danger-dark: #c0392b;
            --accent: #f39c12;
            --dark: #1a252f;
            --light-bg: #f0f4f8;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--dark);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .hidden { display: none !important; }

        /* --- SETUP SCREEN --- */
        .setup-card {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 20px 15px;
            margin-bottom: 20px;
        }

        .setup-section-title {
            margin: 0 0 8px 0;
            color: #475569;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 5px;
            font-size: 13px;
            font-weight: 700;
            border: 2px solid #cbd5e1;
            background: white;
            color: #64748b;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        .setup-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .player-list {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            text-align: left;
        }

        .player-list li {
            background: white;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }

        /* --- BUTTONS --- */
        .btn {
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
        }

        .btn-primary {
            background-color: var(--primary);
            box-shadow: 0 5px 0 var(--primary-dark);
        }

        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .btn-main {
            width: 100%;
            font-size: 18px;
            padding: 16px;
            margin-top: 10px;
        }

        .btn-main:disabled {
            background-color: #cbd5e1;
            box-shadow: 0 5px 0 #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* --- GAMEPLAY DISPLAYS --- */
        
        /* Standard Mode */
        .letter-display {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 25px 0;
        }

        .letter-box {
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            color: #ffffff;
            padding: 20px 10px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.2);
            flex: 1;
        }

        .letter-box h2 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
        }

        .letter {
            font-size: 68px;
            font-weight: 900;
            margin-top: 5px;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Word Length Mode Tiles */
        .wordle-container {
            margin: 30px 0;
        }

        .wordle-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .wordle-tile {
            width: 52px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        .wordle-tile.filled {
            background: linear-gradient(145deg, #4a90e2, #357abd);
            color: white;
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.3);
        }

        .wordle-tile.empty {
            border: 3px dashed #cbd5e1;
            background: #f8fafc;
            color: transparent;
        }

        .plus-badge {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            margin-left: 2px;
        }

        /* Categories Mode Display */
        .category-container {
            margin: 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .single-letter-tile {
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            color: white;
            width: 110px;
            height: 110px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 68px;
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .category-badge {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: white;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.25);
            letter-spacing: -0.2px;
            max-width: 100%;
        }

        /* Pop Animation */
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-next {
            font-size: 20px;
            padding: 16px 40px;
            background-color: var(--primary);
            box-shadow: 0 6px 0 var(--primary-dark), 0 10px 15px rgba(74, 144, 226, 0.3);
        }

        .btn-next:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark), 0 5px 10px rgba(74, 144, 226, 0.2);
        }

        /* --- SCOREBOARD --- */
        .scoreboard {
            margin-top: 35px;
            border-top: 2px solid #f1f5f9;
            padding-top: 20px;
        }

        .scoreboard h3 {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-name {
            font-weight: 700;
            font-size: 17px;
            text-align: left;
            flex: 1;
            color: #334155;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .points-badge {
            background: #e2e8f0;
            color: #1e293b;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            min-width: 55px;
            text-align: center;
        }

        .btn-score {
            width: 38px;
            height: 38px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 0;
        }

        .btn-plus {
            background-color: var(--success);
            box-shadow: 0 4px 0 var(--success-dark);
        }
        .btn-plus:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--success-dark);
        }

        .btn-minus {
            background-color: var(--danger);
            box-shadow: 0 4px 0 var(--danger-dark);
        }
        .btn-minus:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--danger-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Starts With / Ends With</h1>

    <!-- SCREEN 1: START/SETUP -->
    <div id="setup-screen">
        <div class="setup-card">
            <div class="setup-section-title">Select Game Mode</div>
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('standard')">Standard</button>
                <button class="mode-btn" onclick="setMode('length')">Word Length</button>
                <button class="mode-btn" onclick="setMode('categories')">Categories</button>
            </div>

            <div class="setup-section-title">Add Players</div>
            <div class="setup-group">
                <input type="text" id="player-input" placeholder="Player name...">
                <button class="btn btn-primary" onclick="addPlayer()" style="padding: 0 20px;">Add</button>
            </div>
            <ul id="player-list" class="player-list"></ul>
        </div>
        <button id="start-btn" class="btn btn-primary btn-main" onclick="startGame()" disabled>Start Game</button>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="game-screen" class="hidden">
        
        <!-- Standard Mode Layout -->
        <div id="mode-standard" class="letter-display">
            <div class="letter-box">
                <h2>Starts With</h2>
                <div class="letter" id="start-letter">-</div>
            </div>
            <div class="letter-box">
                <h2>Ends With</h2>
                <div class="letter" id="end-letter">-</div>
            </div>
        </div>

        <!-- Word Length Mode Layout -->
        <div id="mode-length" class="wordle-container hidden">
            <div class="setup-section-title" id="length-title">Word Length: 4 Letters</div>
            <div class="wordle-grid" id="wordle-grid"></div>
        </div>

        <!-- Categories Mode Layout -->
        <div id="mode-categories" class="category-container hidden">
            <div class="single-letter-tile pop" id="cat-letter">A</div>
            <div class="category-badge pop" id="cat-name">TV Show</div>
        </div>

        <button class="btn btn-next" onclick="nextRound()">Next Round 🎲</button>

        <div class="scoreboard">
            <h3>Scoreboard</h3>
            <div id="scores-container"></div>
        </div>
    </div>
</div>

<script>
    // Game Configurations
    const startsWithLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T', 'V', 'W', 'Y'];
    const endsWithLetters = ['A', 'D', 'E', 'G', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T', 'Y'];
    const wordLengths = [3, 4, 5, 6]; // 6 represents 6+

    const categoriesList = [
        "TV Show", "Movie", "Celebrity", "City", "Country", "Band / Singer", "Food", 
        "Beverage", "Song Title", "Job", "Game", "Items Around the House", "Items in the Kitchen", 
        "Items at the Beach", "Nature", "Book", "Fictional Character", "Actor", "Actress", 
        "Restaurant", "Something Hot", "TV Channel", "Something Red", "Something Blue", 
        "Something Green", "Emotion", "Car Term", "Body of Water", "Toys", "At the Circus", 
        "Herbs & Spices", "Meats", "Boy Name", "Girl Name", "Company", "Athlete", "Animal", 
        "Tool", "Hobby", "Author", "Award", "Dog Breed", "Superhero", "In the Garden", 
        "Something You See", "Adjective", "Noun", "Verb", "Body Part", "Dessert", 
        "On a Farm", "Villain", "Computer Term", "Car or Truck", "Something Yellow", 
        "Street Name", "Fruit or Veggie", "Something at Costco", "Color", "Olympic Term", 
        "Weather Term", "Candy", "Historical Figure", "Ice Cream Flavor", "Holiday", 
        "Video Game", "Bird", "Wedding Term", "Pizza Topping", "Pet Name", "Cartoon"
    ];

    let currentMode = 'standard';
    let players = [];
    let audioCtx = null;

    // Mode Selector Handler
    function setMode(mode) {
        currentMode = mode;
        const buttons = document.querySelectorAll('.mode-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        if (mode === 'standard') buttons[0].classList.add('active');
        if (mode === 'length') buttons[1].classList.add('active');
        if (mode === 'categories') buttons[2].classList.add('active');
    }

    // Web Audio Synthesizer
    function playAudio(type) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'next') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'point') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.06);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    // Add Player Logic
    function addPlayer() {
        const input = document.getElementById('player-input');
        const name = input.value.trim();
        
        if (name && !players.some(p => p.name === name)) {
            players.push({ name: name, score: 0 });
            input.value = '';
            updatePlayerList();
            document.getElementById('start-btn').disabled = false;
        }
        input.focus();
    }

    document.getElementById('player-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addPlayer();
    });

    function updatePlayerList() {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p => `<li>${p.name}</li>`).join('');
    }

    function startGame() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        // Hide all mode displays first
        document.getElementById('mode-standard').classList.add('hidden');
        document.getElementById('mode-length').classList.add('hidden');
        document.getElementById('mode-categories').classList.add('hidden');

        // Show selected mode container
        document.getElementById(`mode-${currentMode}`).classList.remove('hidden');

        renderScoreboard();
        nextRound();
    }

    function nextRound() {
        playAudio('next');
        const randomStart = startsWithLetters[Math.floor(Math.random() * startsWithLetters.length)];

        if (currentMode === 'standard') {
            const randomEnd = endsWithLetters[Math.floor(Math.random() * endsWithLetters.length)];
            const startEl = document.getElementById('start-letter');
            const endEl = document.getElementById('end-letter');

            startEl.innerText = randomStart;
            endEl.innerText = randomEnd;

            startEl.classList.remove('pop');
            endEl.classList.remove('pop');
            void startEl.offsetWidth;
            startEl.classList.add('pop');
            endEl.classList.add('pop');

        } else if (currentMode === 'length') {
            const chosenLength = wordLengths[Math.floor(Math.random() * wordLengths.length)];
            const gridContainer = document.getElementById('wordle-grid');
            const titleEl = document.getElementById('length-title');

            titleEl.innerText = chosenLength === 6 ? "Word Length: 6+ Letters" : `Word Length: ${chosenLength} Letters`;
            
            let gridHTML = `<div class="wordle-tile filled pop">${randomStart}</div>`;
            for (let i = 1; i < chosenLength; i++) {
                gridHTML += `<div class="wordle-tile empty pop"></div>`;
            }
            if (chosenLength === 6) {
                gridHTML += `<span class="plus-badge pop">+</span>`;
            }

            gridContainer.innerHTML = gridHTML;

        } else if (currentMode === 'categories') {
            const randomCategory = categoriesList[Math.floor(Math.random() * categoriesList.length)];
            const letterEl = document.getElementById('cat-letter');
            const catEl = document.getElementById('cat-name');

            letterEl.innerText = randomStart;
            catEl.innerText = randomCategory;

            letterEl.classList.remove('pop');
            catEl.classList.remove('pop');
            void letterEl.offsetWidth;
            letterEl.classList.add('pop');
            catEl.classList.add('pop');
        }
    }

    function adjustScore(index, amount) {
        if (amount > 0) playAudio('point');
        players[index].score += amount;
        renderScoreboard();
    }

    function renderScoreboard() {
        const container = document.getElementById('scores-container');
        container.innerHTML = players.map((player, index) => `
            <div class="score-row">
                <span class="score-name">${player.name}</span>
                <div class="score-controls">
                    <span class="points-badge">${player.score} pts</span>
                    <button class="btn btn-minus btn-score" onclick="adjustScore(${index}, -1)">-</button>
                    <button class="btn btn-plus btn-score" onclick="adjustScore(${index}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
